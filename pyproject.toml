[project]
name = "okane"
dynamic = ["version"]
description = "Parser for bank statements in camt.053 XML format (Czech Banking Association dialect)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Tomas Karabela", email = "tkarabela@seznam.cz" },
]
requires-python = ">=3.12"
keywords = ["finance", "czech", "banking", "sepa", "expenses", "camt053"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: File Formats",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0",
    "pydantic~=2.5",
]

[project.optional-dependencies]
polars = [
    "polars>=1.0",
]

[project.urls]
Homepage = "https://github.com/tkarabela/okane"
Repository = "https://github.com/tkarabela/okane"
"Bug Tracker" = "https://github.com/tkarabela/okane/issues"

[project.scripts]
okane = "okane:main"

[dependency-groups]
dev = [
    "mypy~=2.1",
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pandas-stubs~=2.1",
    "ruff~=0.15",
    "pytest-datadir>=1.8.0",
    "pyrefly>=1.3.2",
    "types-lxml>=2026.2.16",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/okane"]

[tool.hatch.build.targets.sdist]
include = [
    "src/okane",
    "README.md",
    "LICENSE.txt",
    "tests",
]

[tool.uv]
# Rebuild the editable install when the commit or tags change, so the version stays current
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyrefly]
preset = "strict"
project-excludes = ["tests"]
