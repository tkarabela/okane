# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        pandas-version: ["pandas>=2.1,<3", "pandas>=3.0,<4"]
        lxml-version: ["lxml>=5.0,<6", "lxml>=6.0,<7"]
        exclude:
          - python-version: "3.14"
            lxml-version: "lxml>=5.0,<6"

    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.11.14"
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
        uv pip install "${{ matrix.pandas-version }}" "${{ matrix.lxml-version }}"
    - name: Typecheck with mypy
      run: |
        uv run mypy src/okane
    - name: Check with ruff
      run: |
        uv run ruff check src/okane
    - name: Test with pytest and doctest
      run: |
        uv run python -m pytest
        uv run python -m doctest -v README.md
    - name: Generate coverage report for okane.py
      run: |
        uv run python -m pytest --cov=okane --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        env_vars: OS,PYTHON
